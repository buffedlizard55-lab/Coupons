name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the dataset against the shards
        run: python3 scripts/build_site.py --check

      - name: Run integrity tests
        run: python3 -m unittest discover -s tests -v

      - name: Build dataset and site
        run: python3 scripts/build_site.py

      - name: Regenerate the bulk shards and confirm they are reproducible
        run: |
          python3 scripts/generate_bulk_entries.py
          python3 scripts/build_site.py --check

      - name: Summarise what was built
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          d = json.loads(pathlib.Path("data/coupons.json").read_text())
          s = d["stats"]
          lines = [
              "## Build summary",
              "",
              f"- Verified offers: **{s['entry_count']}**",
              f"- Rejected / unverified claims documented: **{s['excluded_count']}**",
              f"- Citations: **{s['source_count']}** across **{len(s['source_domains'])}** domains",
              f"- Verification levels: {s['entries_by_verification_level']}",
              f"- Flags by severity: {s['flags_by_severity']}",
              "",
              "Every offer in this build cites the issuer's own page, with the date it was read.",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              pathlib.Path(summary).write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
